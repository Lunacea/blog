<!doctype html>
<html lang="ja" data-theme="light" data-motion="off">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icons/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      (() => {
        try {
          const themePreference = localStorage.getItem("lunacea-theme") || "auto";
          const storedMotion = localStorage.getItem("lunacea-motion");
          const motionPreference = storedMotion === "off" || storedMotion === "reduced"
            ? "off"
            : "full";
          const theme = themePreference === "auto"
            ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : themePreference;
          const connection = navigator.connection;
          const limited = matchMedia("(prefers-reduced-motion: reduce)").matches ||
            matchMedia("(forced-colors: active)").matches || connection?.saveData;
          const motion = motionPreference === "off" || limited ? "off" : "full";
          const root = document.documentElement;
          root.dataset.theme = theme;
          root.dataset.motion = motion;
          // 初回描画前に宣言する。ハイドレーション後に再生し直さないため。
          if (location.pathname === "/" && motion === "full") {
            root.dataset.homeOpening = "active";
          }
        } catch {
          document.documentElement.dataset.motion = "off";
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
