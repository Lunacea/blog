name: Post-deployment verification

on:
  repository_dispatch:
    types: [deno_deploy.build.routed]

permissions:
  contents: read

concurrency:
  group: deploy-check-${{ github.event.client_payload.revision.preview_url || github.run_id }}
  cancel-in-progress: true

jobs:
  post-deployment:
    name: Verify deployed revision
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate deployment notification
        id: revision
        uses: actions/github-script@v7
        with:
          script: |
            const revision = context.payload.client_payload?.revision;
            const sha = revision?.git?.sha;
            if (!/^[a-f0-9]{40}$/i.test(sha ?? '')) {
              throw new Error('Missing or invalid deployment commit SHA');
            }
            const url = new URL(revision.preview_url);
            if (url.protocol !== 'https:' || !url.hostname.endsWith('.deno.net') ||
                url.username || url.password || url.port || url.pathname !== '/' ||
                url.search || url.hash) {
              throw new Error('Expected a Deno Deploy HTTPS preview origin');
            }
            core.setOutput('sha', sha);
            core.setOutput('url', url.origin);

      - name: Checkout deployed commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Generate content manifests
        run: deno task content:generate

      - name: Install locked dependencies
        run: deno install --frozen --allow-scripts=npm:sharp

      - name: Install Chromium
        run: deno run -A npm:playwright@1.61.1 install --with-deps chromium

      - name: Run deployed E2E tests
        env:
          E2E_BASE_URL: ${{ steps.revision.outputs.url }}
        run: deno task test:e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: deployed-playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize verification
        if: always() && steps.revision.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.revision.outputs.url }}
          REVISION_SHA: ${{ steps.revision.outputs.sha }}
          VERIFICATION_STATUS: ${{ job.status }}
        with:
          script: |
            await core.summary.addHeading('Deno Deploy verification')
              .addLink('Preview', process.env.PREVIEW_URL)
              .addTable([
                [{ data: 'Commit', header: true }, process.env.REVISION_SHA],
                [{ data: 'Result', header: true }, process.env.VERIFICATION_STATUS],
              ]).write();
