name: Quality gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# 互いに依存しない検査を別のジョブで並行させる。以前は1つのジョブで順に回していた。
jobs:
  static:
    name: Format, lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up the workspace
        uses: ./.github/actions/setup

      - name: Check formatting
        run: deno task fmt:check

      - name: Lint
        run: deno task lint

      - name: Check design system
        run: deno task design:check

      - name: Validate Svelte types
        run: deno task --cwd apps/web check

      - name: Run Deno and component tests
        run: deno task test

  e2e:
    name: Build, budget, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          browser: "true"

      - name: Build application
        run: deno task --cwd apps/web build:prepared

      - name: Check article JavaScript budget
        run: deno task budget:check

      - name: Run Playwright and axe
        env:
          E2E_PREVIEW: "true"
        run: deno task test:e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          browser: "true"

      - name: Check Storybook
        run: deno task storybook:check
